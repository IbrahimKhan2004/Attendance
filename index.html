<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMS Varanasi — BCA-II Section C</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- LOGIN VIEW -->
<div id="loginView" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:1rem;">
  <div class="ios-card" style="width:100%; max-width:400px; padding:2rem;">
    <h2 style="font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; text-align:center;">Sign In</h2>
    <input type="text" id="loginUsername" placeholder="Username" style="width:100%; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:white; margin-bottom:1rem;">
    <input type="password" id="loginPassword" placeholder="Password" style="width:100%; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:white; margin-bottom:1.5rem;">
    <button onclick="window.handleLogin()" style="width:100%; padding:12px; background:var(--accent); border:none; color:white; border-radius:10px; font-weight:600; font-size:1rem;">Login</button>
    <div id="loginError" style="color:var(--accent2); margin-top:1rem; text-align:center; font-size:0.9rem; display:none;"></div>
  </div>
</div>

<!-- MAIN APP VIEW -->
<div id="appView" style="display:none;">

<div class="header">
  <div class="college-name" id="headerCollegeName">Loading...</div>
  <div class="section-name" id="headerSectionName">Loading...</div>
  <button onclick="window.handleLogout()" style="position:absolute; right:1rem; top:1rem; background:var(--surface); color:var(--muted); border:1px solid var(--border); padding:4px 8px; border-radius:6px; font-size:0.7rem;">Logout</button>
</div>

<div class="live-clock">
  <div class="clock-block">
    <div class="clock-time" id="clockTime">00:00:00</div>
    <div class="clock-date" id="clockDate">---</div>
  </div>
  <div class="period-status" id="periodStatus">
    <div class="period-label">Current Period</div>
    <div class="period-current" id="currentPeriod">Loading...</div>
    <div class="period-next" id="nextPeriod">—</div>
    <div class="period-bar-wrap"><div class="period-bar" id="periodBar" style="width:0%"></div></div>
  </div>
</div>

<div class="tabs-container">
  <div class="tabs" id="tabNav">
    <button class="tab active" data-target="timetable">Timetable</button>
    <button class="tab" data-target="holidays">Holidays</button>
    <button class="tab" data-target="attendance">Attendance</button>
    <button class="tab" data-target="syllabus">Syllabus</button>
  </div>
</div>

<!-- TIMETABLE PAGE -->
<div class="page active" id="page-timetable" style="padding: 0 1rem;">
  <div id="ttContainer"></div>
</div>

<!-- HOLIDAYS PAGE -->
<div class="page" id="page-holidays" style="padding: 0 1rem;">
  <div id="holidayList"></div>
</div>

<!-- ATTENDANCE PAGE -->
<div class="page" id="page-attendance" style="padding: 0 1rem;">
  <div style="display:flex; justify-content:center; margin: 2rem 0;">
    <div style="position:relative; width:160px; height:160px;">
      <svg width="160" height="160" viewBox="0 0 160 160" style="transform: rotate(-90deg);">
        <circle cx="80" cy="80" r="60" fill="none" stroke="var(--border)" stroke-width="12" />
        <line id="ringTarget" x1="80" y1="14" x2="80" y2="26" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" opacity="0.7" transform="rotate(270 80 80)" />
        <circle id="ringFg" cx="80" cy="80" r="60" fill="none" stroke="var(--accent2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" style="transition: stroke-dashoffset 1s ease, stroke 1s ease;" />
      </svg>
      <div style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <span id="ringPct" style="font-size:2rem; font-weight:700; font-family:var(--font-mono);">0%</span>
        <span style="font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">overall</span>
      </div>
    </div>
  </div>
  <div style="text-align:center; font-size:0.7rem; color:var(--muted); margin-top:-1.5rem; margin-bottom:1rem;">tick mark = 75% required</div>

  <div id="attSummary"></div>
  <div id="attAlert"></div>

  <div style="margin-top:2rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <h3 style="font-size:0.8rem; text-transform:uppercase; color:var(--muted); letter-spacing:1px;">Subject-wise</h3>
      <span style="font-size:0.7rem; color:var(--muted);">present / total</span>
    </div>
    <div id="subjectAttRows"></div>
  </div>

  <div style="margin-top:2rem;">
    <h3 style="font-size:0.8rem; text-transform:uppercase; color:var(--muted); margin-bottom:1rem; letter-spacing:1px;">Last 7 days</h3>
    <div id="attTrend"></div>
  </div>

  <div style="margin-top:2rem; margin-bottom: 3rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <h3 style="font-size:0.8rem; text-transform:uppercase; color:var(--muted); letter-spacing:1px;">Daily Log</h3>
      <button onclick="window.openAddModal()" style="background:var(--accent); color:white; border:none; padding:6px 12px; border-radius:100px; font-weight:600; font-size:0.8rem;">+ Mark Today</button>
    </div>
    <div id="attLog"></div>
  </div>
</div>

<!-- SYLLABUS PAGE -->
<div class="page" id="page-syllabus" style="padding: 0 1rem;">
  <div id="syllabusContainer"></div>
</div>

<!-- ADMIN PAGE -->
<div class="page" id="page-admin" style="padding: 0 1rem;">
  <div id="adminContainer"></div>
</div>

<!-- Add Attendance Modal -->
<div id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); z-index:100; align-items:center; justify-content:center; padding:1rem;">
  <div class="ios-card" style="width:100%; max-width:400px; max-height:80vh; display:flex; flex-direction:column; padding:0;">
    <div style="padding:1.5rem 1.5rem 0.5rem;">
      <h2 style="font-size:1.2rem; font-weight:700; margin-bottom:0.5rem;">Mark Attendance</h2>
      <p style="font-size:0.8rem; color:var(--muted);">Adjust subjects if there was a proxy.</p>
    </div>
    <div style="padding:1rem 1.5rem; overflow-y:auto; flex:1;">
      <label style="display:block; font-size:0.8rem; color:var(--muted); margin-bottom:4px;">Date</label>
      <input type="date" id="modalDate" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:white; margin-bottom:1.5rem; color-scheme: dark;">
      <div id="modalPeriods"></div>
    </div>
    <div style="padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:1rem;">
      <button onclick="window.closeModal()" style="flex:1; padding:12px; background:var(--surface); border:1px solid var(--border); color:white; border-radius:10px; font-weight:600;">Cancel</button>
      <button onclick="window.saveAttendance()" style="flex:1; padding:12px; background:var(--accent); border:none; color:white; border-radius:10px; font-weight:600;">Save</button>
    </div>
  </div>
</div>

</div> <!-- END MAIN APP VIEW -->

<!-- Initialize Application -->
<script type="module" src="js/core/auth.js"></script>
<script type="module" src="js/core/app.js"></script>

</body>
</html>
